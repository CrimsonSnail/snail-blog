<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدونة الحلزون | Snail Blog</title>
    <!-- أداة المصادقة الخاصة بـ Netlify (ضرورية لتسجيل الدخول إلى /admin) -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        body {
            background-color: #f4f1ea; /* خلفية ذات طابع عتيق وكريمي */
            color: #2c221e;
            font-family: "Traditional Arabic", "Amiri", serif, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.8;
        }
        header {
            text-align: center;
            border-bottom: 2px dashed #b5a48b;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.4em;
            margin: 0;
            color: #4a3b32;
        }
        p.subtitle {
            color: #7c6f64;
            font-size: 1.1em;
            margin-top: 5px;
        }
        h2.section-title {
            font-size: 1.5em;
            color: #4a3b32;
            margin-bottom: 15px;
            border-right: 4px solid #b5a48b;
            padding-right: 10px;
        }
        /* صندوق التدوينات القابل للتمرير (Scroll) */
        .posts-container {
            max-height: 450px;
            overflow-y: auto;
            padding: 15px;
            border: 1px solid #dcd2c3;
            background: #faf8f5;
            border-radius: 8px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.03);
        }
        /* تخصيص شكل شريط التمرير (Scrollbar) ليناسب الطابع العتيق */
        .posts-container::-webkit-scrollbar {
            width: 8px;
        }
        .posts-container::-webkit-scrollbar-track {
            background: #eae3d2;
            border-radius: 4px;
        }
        .posts-container::-webkit-scrollbar-thumb {
            background: #b5a48b;
            border-radius: 4px;
        }
        .posts-container::-webkit-scrollbar-thumb:hover {
            background: #8c7d70;
        }
        .post-card {
            background: #ffffff;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #e6dfd5;
            transition: all 0.2s ease-in-out;
        }
        .post-card:last-child {
            margin-bottom: 0;
        }
        .post-card:hover {
            transform: translateX(-4px);
            border-color: #b5a48b;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.05);
        }
        .post-title {
            font-size: 1.3em;
            color: #3b2f2f;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .post-title:hover {
            color: #8c6d53;
        }
        .post-date {
            font-size: 0.85em;
            color: #9e9185;
            display: block;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9em;
            color: #8c7d70;
            border-top: 1px solid #e6dfd5;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>مدونة الحلزون 🐌</h1>
        <p class="subtitle">مساحة هادئة للتدوين بخطوات بطيئة وثابتة</p>
    </header>

    <main>
        <h2 class="section-title">التدوينات الأخيرة</h2>
        
        <!-- قسم القائمة القابلة للتمرير (Scroll) -->
        <div class="posts-container">
            
            <!-- تدوينة 1 (يمكنك تغيير الرابط والعنوان وتاريخ النشر) -->
            <div class="post-card">
                <a href="./_posts/2026-10-12-أنها-تعمل-يا-رفاق.html" class="post-title">أنها تعمل يا رفاق</a>
                <span class="post-date">١٢ أكتوبر ٢٠٢٦</span>
            </div>

            <!-- تدوينة 2 تجريبية -->
            <div class="post-card">
                <a href="#" class="post-title">رحلة البحث عن البساطة في الويب</a>
                <span class="post-date">١٠ أكتوبر ٢٠٢٦</span>
            </div>

            <!-- تدوينة 3 تجريبية -->
            <div class="post-card">
                <a href="#" class="post-title">عن الفن والخطوات البطيئة</a>
                <span class="post-date">٠٥ أكتوبر ٢٠٢٦</span>
            </div>

            <!-- يمكنك إضافة المزيد من بطاقات التدوينات هنا -->

        </div>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة © مدونة الحلزون 🐌</p>
    </footer>

</body>
</html>
