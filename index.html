<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snail Blog</title>
    
    <!-- Fallback Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* Custom Font Declaration */
        @font-face {
            font-family: 'SakkalKitab';
            src: url('SakkalKitab.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --paper: #fcf0dd;
            --accent: #ba5536;
            --ink: #4b3b2a;
            --frame: #6b5236;
            --line: #d9c3a0;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* Apply SakkalKitab as the primary font globally */
        html, body, button, input, textarea, select {
            font-family: 'SakkalKitab', 'Amiri', serif;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            margin: 0;
            padding: 0;
            line-height: 2.1;
            direction: rtl;
            text-align: right;
            font-size: 1.3rem;
        }

        /* Header Layout: Right (Title), Center (Logo), Left (Menu) */
        header.top-bar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 28px 22px 10px;
        }

        /* Site Title - Right Aligned */
        .site-title {
            justify-self: start;
            font-size: 2.3rem;
            color: var(--accent);
            text-decoration: none;
            line-height: 1.2;
            font-weight: bold;
        }

        /* Snail Logo - Center Aligned */
        .snail-logo {
            justify-self: center;
        }
        .snail-logo svg {
            width: 56px;
            height: auto;
            display: block;
        }

        /* Menu Button - Left Aligned */
        .menu-btn {
            justify-self: end;
            background: var(--accent);
            border: 4px solid var(--frame);
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            cursor: pointer;
            box-shadow: 3px 4px 6px rgba(75, 59, 42, 0.35);
        }

        .menu-btn svg {
            width: 14px;
            height: 26px;
            fill: var(--paper);
        }

        /* Main Article Container */
        main.container {
            max-width: 40rem;
            margin: 0 auto;
            padding: 40px 6% 80px;
        }

        article.post h1.post-title {
            text-align: center;
            font-size: 2.4rem;
            color: var(--accent);
            font-weight: normal;
            margin: 0 0 5px 0;
            line-height: 1.5;
        }

        .post-date {
            text-align: center;
            font-size: 1rem;
            color: #1f1a14;
            line-height: 1.6;
            margin: 2px 0 22px;
        }

        .post-body {
            text-align: justify;
            text-justify: inter-word;
        }

        .post-body p {
            margin: 0 0 20px 0;
        }
    </style>
</
