backend:
  name: github
  repo: CrimsonSnail/blog # مثال: CrimsonSnail/blog
  branch: main # أو master حسب اسم الفرع لديك

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "التدوينات"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "عنوان التدوينة", name: "title", widget: "string" }
      - { label: "تاريخ النشر", name: "date", widget: "datetime" }
      - { label: "محتوى التدوينة", name: "body", widget: "markdown" }
